name: Build X4 radio firmware

# Manual build of the original-X4 firmware with the two-unit link over ESP-NOW (PlatformIO env x4-radio).
# Run it from the Actions tab: "Build X4 radio firmware" > "Run workflow". The finished firmware.bin is attached
# to the run as an artifact called firmware-x4-radio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x4-radio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # Same pins as the repository's own CI: the platform's builder imports these unconditionally.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-x4-radio-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-x4-radio-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Keeps the nested build's pioarduino core on the same version as the outer one
          # (see platformio.ini's firmware_tuned profiles and pioarduino/platform-espressif32#529).
          pio pkg install -e x4-radio
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build x4-radio firmware
        run: |
          set -euo pipefail
          pio run -e x4-radio | tee pio.log

      - name: Firmware stats
        run: |
          {
            echo "## x4-radio firmware build stats"
            grep -E "RAM:\s" -m1 pio.log || echo "RAM: not found"
            grep -E "Flash:\s" -m1 pio.log || echo "Flash: not found"
            ls -l .pio/build/x4-radio/firmware.bin
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-x4-radio
          path: .pio/build/x4-radio/firmware.bin
          if-no-files-found: error
